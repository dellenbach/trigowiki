# Trigowiki Produktions-Stack (MediaWiki 1.45.3, MySQL 5.7, OpenSearch 1.3)
#
# Ersteinrichtung neuer Server: script/setup-new-server.sh
# Vorlage fuer Secrets: .env.example  →  .env (gitignored)
# Container neu erstellen: script/start-wiki-production.sh
# Backup (Cron): script/backup-production-daily.sh
# OpenResty-Proxy: script/prepare-openresty.sh

services:

  mediawiki_mysql_production:
    image: mysql:5.7
    restart: unless-stopped
    container_name: mediawiki_mysql_production
    environment:
      MYSQL_DATABASE: wikidb
      MYSQL_ROOT_PASSWORD: ${MEDIAWIKI_DB_PASSWORD:?set MEDIAWIKI_DB_PASSWORD in .env}
    networks:
      - trigowiki_production
    volumes:
      - mediawiki_mysql_production:/var/lib/mysql
      - ${PROD_ROOT:-/srv/mediawiki-production}/backup:/backup

  opensearch_production:
    image: opensearchproject/opensearch:1.3.20
    container_name: opensearch_production
    restart: unless-stopped
    environment:
      - discovery.type=single-node
      - DISABLE_INSTALL_DEMO_CONFIG=true
      - DISABLE_SECURITY_PLUGIN=true
      - "OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m"
      # Disk-Watermark deaktivieren (kleine Instanz)
      - cluster.routing.allocation.disk.threshold_enabled=false
    networks:
      - trigowiki_production
    volumes:
      - opensearch_production_data:/usr/share/opensearch/data

  mediawiki_wiki_production:
    image: mediawiki:1.45.3
    container_name: mediawiki_wiki_production
    restart: unless-stopped
    depends_on:
      - mediawiki_mysql_production
      - opensearch_production
    networks:
      - trigowiki_production
    environment:
      MEDIAWIKI_SERVER: ${MEDIAWIKI_SERVER:-http://trigowiki.trigonet.local}
      MEDIAWIKI_SITENAME: Trigowiki
      MEDIAWIKI_LANGUAGE_CODE: de
      MEDIAWIKI_SECRET_KEY: ${MEDIAWIKI_SECRET_KEY:?set MEDIAWIKI_SECRET_KEY in .env}
      MEDIAWIKI_EMERGENCY_CONTACT: ${MEDIAWIKI_EMERGENCY_CONTACT:-}
      MEDIAWIKI_PASSWORD_SENDER: ${MEDIAWIKI_PASSWORD_SENDER:-}
      MEDIAWIKI_DB_TYPE: mysql
      MEDIAWIKI_DB_HOST: mediawiki_mysql_production
      MEDIAWIKI_DB_PORT: "3306"
      MEDIAWIKI_DB_NAME: wikidb
      MEDIAWIKI_DB_USER: root
      MEDIAWIKI_DB_TABLE_OPTIONS: "ENGINE=InnoDB, DEFAULT CHARSET=binary"
      MEDIAWIKI_DB_PASSWORD: ${MEDIAWIKI_DB_PASSWORD:?set MEDIAWIKI_DB_PASSWORD in .env}
      MEDIAWIKI_SEARCH_HOST: opensearch_production
      MEDIAWIKI_SEARCH_ENABLED: "1"
      MEDIAWIKI_ENABLE_UPLOADS: "1"
      MEDIAWIKI_DEFAULT_SKIN: vector
      MEDIAWIKI_SMTP_HOST: ${MEDIAWIKI_SMTP_HOST:-}
      MEDIAWIKI_SMTP_PORT: ${MEDIAWIKI_SMTP_PORT:-}
      MEDIAWIKI_SMTP_AUTH: ${MEDIAWIKI_SMTP_AUTH:-}
      MEDIAWIKI_SMTP_SECURE: ${MEDIAWIKI_SMTP_SECURE:-}
      MEDIAWIKI_SMTP_USERNAME: ${MEDIAWIKI_SMTP_USERNAME:-}
      MEDIAWIKI_SMTP_PASSWORD: ${MEDIAWIKI_SMTP_PASSWORD:-}
    ports:
      - "8081:80"
    volumes:
      - ${PROD_ROOT:-/srv/mediawiki-production}/config-lts/LocalSettings.php:/var/www/html/LocalSettings.php
      - ${PROD_ROOT:-/srv/mediawiki-production}/config-lts/SearchSettings.php:/var/www/html/SearchSettings.php
      - ${PROD_ROOT:-/srv/mediawiki-production}/config-lts/RecentBreadcrumbs.php:/var/www/html/RecentBreadcrumbs.php
      - ${PROD_ROOT:-/srv/mediawiki-production}/config-lts/InfixTitleSearch.php:/var/www/html/InfixTitleSearch.php
      - ${PROD_ROOT:-/srv/mediawiki-production}/extensions-lts/Elastica:/var/www/html/extensions/Elastica
      - ${PROD_ROOT:-/srv/mediawiki-production}/extensions-lts/CirrusSearch:/var/www/html/extensions/CirrusSearch
      - ${PROD_ROOT:-/srv/mediawiki-production}/extensions-lts/AdvancedSearch:/var/www/html/extensions/AdvancedSearch
      - ${PROD_ROOT:-/srv/mediawiki-production}/extensions-lts/TimedMediaHandler:/var/www/html/extensions/TimedMediaHandler
      - ${PROD_ROOT:-/srv/mediawiki-production}/extensions-lts/Interwiki:/var/www/html/extensions/Interwiki
      - ${PROD_ROOT:-/srv/mediawiki-production}/images:/var/www/html/images
      - ${PROD_ROOT:-/srv/mediawiki-production}/Ressourcen:/var/www/html/resources/trigowiki:ro

volumes:
  mediawiki_mysql_production:
  opensearch_production_data:

networks:
  trigowiki_production:
    name: trigowiki_production
