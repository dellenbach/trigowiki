daemon off;
user www-data www-data;
error_log /dev/stderr error;
events {
    worker_connections 1024;
}
http {
    include /etc/nginx/mime.types;
    server_tokens off;
    error_log /dev/stderr error;
    access_log /dev/stdout;
    charset utf-8;

    upstream appsmith_backend {
        server 10.203.2.50:8080;
    }

    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    proxy_read_timeout 300;
    proxy_send_timeout 300;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    server {
        listen 8080;
        listen [::]:8080;
        server_name trigowiki.trigonet.local _;

        server_tokens off;
        root /var/www/mediawiki;
        client_max_body_size 500M;
        client_body_timeout 60;

        location = /app {
            proxy_pass http://appsmith_backend/app;
            proxy_http_version 1.1;
        }

        location ^~ /app/ {
            proxy_pass http://appsmith_backend;
            proxy_http_version 1.1;
        }

        location ^~ /applications {
            proxy_pass http://appsmith_backend;
            proxy_http_version 1.1;
        }

        location ^~ /user/ {
            proxy_pass http://appsmith_backend;
            proxy_http_version 1.1;
        }

        location ^~ /api/ {
            proxy_pass http://appsmith_backend;
            proxy_http_version 1.1;
        }

        location ^~ /v1/ {
            proxy_pass http://appsmith_backend;
            proxy_http_version 1.1;
        }

        location ^~ /oauth2/ {
            proxy_pass http://appsmith_backend;
            proxy_http_version 1.1;
        }

        location ^~ /login/ {
            proxy_pass http://appsmith_backend;
            proxy_http_version 1.1;
        }

        location ^~ /logout/ {
            proxy_pass http://appsmith_backend;
            proxy_http_version 1.1;
        }

        location ^~ /signup/ {
            proxy_pass http://appsmith_backend;
            proxy_http_version 1.1;
        }

        location ^~ /static/ {
            proxy_pass http://appsmith_backend;
            proxy_http_version 1.1;
        }

        location ^~ /assets/ {
            proxy_pass http://appsmith_backend;
            proxy_http_version 1.1;
        }

        location ^~ /scripts/ {
            proxy_pass http://appsmith_backend;
            proxy_http_version 1.1;
        }

        location ^~ /health-check/ {
            proxy_pass http://appsmith_backend;
            proxy_http_version 1.1;
        }

        location = /favicon.ico {
            proxy_pass http://appsmith_backend;
            proxy_http_version 1.1;
        }

        location ^~ /socket.io/ {
            proxy_pass http://appsmith_backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
        }

        location ^~ /ws {
            proxy_pass http://appsmith_backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
        }

        location ~ \.htaccess {
            deny all;
        }

        location / {
            try_files $uri @rewrite;
        }

        location ^~ /mw-config/ {
            internal;
        }

        location @rewrite {
            rewrite ^/(.*)$ /index.php;
        }

        location ^~ /maintenance/ {
            internal;
        }

        location ~* \.(js|css|png|jpg|jpeg|gif|ico)$ {
            try_files $uri /index.php;
            expires max;
            log_not_found off;
        }

        location = /_.gif {
            expires max;
            empty_gif;
        }

        location ^~ /cache/ {
            internal;
        }

        location ~ \.php$ {
            fastcgi_pass unix:/var/run/php7-fpm/mediawiki.socket;
            fastcgi_split_path_info ^(.+\.php)(/.*)$;
            include fastcgi_params;
            fastcgi_param PATH_TRANSLATED $document_root$fastcgi_script_name;
            fastcgi_param HTTPS off;
            fastcgi_index index.php;
        }
    }

    server {
        listen 8080;
        listen [::]:8080;
        server_name appsmith.trigonet.local;

        server_tokens off;

        location ^~ /socket.io/ {
            proxy_pass http://appsmith_backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
        }

        location ^~ /ws {
            proxy_pass http://appsmith_backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
        }

        location / {
            proxy_pass http://appsmith_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_redirect http://10.203.2.50:8080/ http://appsmith.trigonet.local/;
        }
    }
}
