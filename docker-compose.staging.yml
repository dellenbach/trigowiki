services:

  mediawiki_mysql_staging:
    image: mysql:5.7
    restart: unless-stopped
    container_name: mediawiki_mysql_staging
    environment:
      MYSQL_DATABASE: wikidb
      MYSQL_ROOT_PASSWORD: ${STAGING_DB_ROOT_PASSWORD:?set STAGING_DB_ROOT_PASSWORD in .env}
    networks:
      - wikinet_staging
    volumes:
      - mediawiki_mysql_staging:/var/lib/mysql
      - ${STAGING_ROOT:-/home/del/mediawiki-staging}/backup:/srv/mediawiki/backup

  mediawiki_wiki_staging:
    build:
      context: .
      dockerfile: Dockerfile
    image: trigowiki:staging
    restart: unless-stopped
    container_name: mediawiki_wiki_staging
    networks:
      - wikinet_staging
    environment:
      MEDIAWIKI_SERVER: ${STAGING_MEDIAWIKI_SERVER:-http://brisen:8081}
      MEDIAWIKI_SITENAME: Trigowiki Staging
      MEDIAWIKI_LANGUAGE_CODE: de
      MEDIAWIKI_SECRET_KEY: ${STAGING_MEDIAWIKI_SECRET_KEY:?set STAGING_MEDIAWIKI_SECRET_KEY in .env}
      MEDIAWIKI_DB_TYPE: mysql
      MEDIAWIKI_DB_HOST: mediawiki_mysql_staging
      MEDIAWIKI_DB_PORT: 3306
      MEDIAWIKI_DB_NAME: wikidb
      MEDIAWIKI_DB_USER: root
      MEDIAWIKI_DB_TABLE_OPTIONS: ENGINE=InnoDB, DEFAULT CHARSET=binary
      MEDIAWIKI_DB_PASSWORD: ${STAGING_DB_ROOT_PASSWORD:?set STAGING_DB_ROOT_PASSWORD in .env}
      MEDIAWIKI_SEARCH_HOST: elasticsearch_staging
      MEDIAWIKI_ENABLE_UPLOADS: 1
      MEDIAWIKI_EXTENSION_VISUAL_EDITOR_ENABLED: 1
      MEDIAWIKI_DEFAULT_SKIN: vector
    ports:
      - "${STAGING_HTTP_PORT:-8081}:8080"
    depends_on:
      - mediawiki_mysql_staging
      - elasticsearch_staging
    volumes:
      - ${STAGING_ROOT:-/home/del/mediawiki-staging}/config/LocalSettings.php:/var/www/mediawiki/LocalSettings.php
      - ${STAGING_ROOT:-/home/del/mediawiki-staging}/config/ExtraLocalSettings.php:/var/www/mediawiki/ExtraLocalSettings.php
      - ${STAGING_ROOT:-/home/del/mediawiki-staging}/config/Permissions.php:/var/www/mediawiki/Permissions.php
      - ${STAGING_ROOT:-/home/del/mediawiki-staging}/config/Extensions.php:/var/www/mediawiki/Extensions.php
      - ${STAGING_ROOT:-/home/del/mediawiki-staging}/config/UploadSettings.php:/var/www/mediawiki/UploadSettings.php
      - ${STAGING_ROOT:-/home/del/mediawiki-staging}/config/EmbeddingSettings.php:/var/www/mediawiki/EmbeddingSettings.php
      - ${STAGING_ROOT:-/home/del/mediawiki-staging}/config/CirrusSearchTuning.php:/var/www/mediawiki/CirrusSearchTuning.php
      - ${STAGING_ROOT:-/home/del/mediawiki-staging}/config/nginx.conf:/etc/nginx/nginx.conf
      - ${STAGING_ROOT:-/home/del/mediawiki-staging}/images:/var/www/mediawiki/images
      - ${STAGING_ROOT:-/home/del/mediawiki-staging}/Ressourcen:/var/www/mediawiki/resources/trigowiki:ro
      - ${STAGING_ROOT:-/home/del/mediawiki-staging}/extensions:/var/www/mediawiki/extensions
      - ${STAGING_ROOT:-/home/del/mediawiki-staging}/skins/Vector:/var/www/mediawiki/skins/Vector
      - ${STAGING_ROOT:-/home/del/mediawiki-staging}/includes:/var/www/mediawiki/includes

  elasticsearch_staging:
    image: elasticsearch:5.4
    restart: unless-stopped
    container_name: elasticsearch_staging
    networks:
      - wikinet_staging
    volumes:
      - esdata_staging:/usr/share/elasticsearch/data

volumes:
  mediawiki_mysql_staging:
  esdata_staging:

networks:
  wikinet_staging: